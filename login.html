<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Login - VIP Task Earn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container login-container">
        <div class="logo-icon">💰</div>
        <h1>VIP Task Earn</h1>
        <p class="subtitle">Earn money by completing daily tasks</p>
        
        <div class="form-group">
            <label>User ID</label>
            <input type="text" id="loginUserId" placeholder="Enter your User ID" />
        </div>
        
        <button onclick="loginUser()" class="btn-primary">Login</button>
        
        <p class="divider">━━━ OR ━━━</p>
        
        <button onclick="window.location.href='register.html'" class="btn-secondary">
            Create New Account
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
