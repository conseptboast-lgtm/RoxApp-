<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - VIP Task Earn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-header">
        <div>
            <span class="greeting">👤</span>
            <span class="user-name">My Profile</span>
        </div>
        <button onclick="window.location.href='index.html'" class="btn-back">← Back</button>
    </div>

    <div class="app-content">
        <div class="section-card">
            <div class="profile-item">
                <span class="label">Full Name</span>
                <span id="profileName">-</span>
            </div>
            <div class="profile-item">
                <span class="label">Email</span>
                <span id="profileEmail">-</span>
            </div>
            <div class="profile-item">
                <span class="label">Phone</span>
                <span id="profilePhone">-</span>
            </div>
            <div class="profile-item">
                <span class="label">User ID</span>
                <span id="profileUserId">-</span>
            </div>
            <div class="profile-item">
                <span class="label">VIP Level</span>
                <span id="profileLevel">-</span>
            </div>
            <div class="profile-item">
                <span class="label">Balance</span>
                <span id="profileBalance">-</span>
            </div>
            <div class="profile-item">
                <span class="label">Total Earned</span>
                <span id="profileTotalEarned">-</span>
            </div>
            <div class="profile-item">
                <span class="label">Joined Date</span>
                <span id="profileJoinDate">-</span>
            </div>
        </div>

        <div class="section-card">
            <h3>📊 Earnings Breakdown</h3>
            <div class="earnings-breakdown">
                <div class="earnings-item">
                    <span class="label">Today</span>
                    <span id="earnedToday">₦0</span>
                </div>
                <div class="earnings-item">
                    <span class="label">Yesterday</span>
                    <span id="earnedYesterday">₦0</span>
                </div>
                <div class="earnings-item">
                    <span class="label">This Month</span>
                    <span id="earnedMonth">₦0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
